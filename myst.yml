version: 1
# The Neuromatch course kit: adds the MyST plugin ({nma-video}, {nma-solution},
# editable cells, scrolly pages, ...) and turns on JupyterLite. @0.4 = newest
# 0.4.x; CI pins it to the exact version of the workflow's kit release.
extend: https://cdn.jsdelivr.net/npm/@neuromatch/course-kit@0.4/dist/nma.yml
project:
  title: Neuromatch Course Guide
  authors:
    - name:
        literal: Neuromatch
      github: neuromatch
  github: https://github.com/neuromatch/course-kit-guide
  license:
    code: BSD-3-Clause
    content: CC-BY-4.0
  toc:
    - file: guide/index.md
    - file: guide/start/index.md
      children:
        - file: guide/start/what-is-the-kit.md
    - file: guide/author/index.md
      children:
        - file: guide/author/quick-start.md
        - file: guide/author/write-pages.md
        - file: guide/author/add-a-page.md
        - file: guide/author/figures-math-xrefs.md
        - file: guide/author/page-types.md
        - file: guide/author/run-code-in-browser.md
        - file: guide/author/rich-outputs.md
        - file: guide/author/images-and-data.md
        - file: guide/author/exercises.md
        - file: guide/author/videos-and-slides.md
        - file: guide/author/scrolly.md
        - file: guide/author/more-myst.md
        - file: guide/author/fix-a-failing-check.md
    - file: guide/maintainer/index.md
      children:
        - file: guide/maintainer/create-a-course.md
        - file: guide/maintainer/publish-with-ci.md
        - file: guide/maintainer/notebooks-and-badges.md
        - file: guide/maintainer/instructor-site.md
        - file: guide/maintainer/branding.md
        - file: guide/maintainer/structure-and-scale.md
    - file: guide/instructor/index.md
    - file: guide/reference/index.md
      children:
        - file: guide/reference/directives.md
        - file: guide/reference/frontmatter.md
        - file: guide/reference/nma-config.md
        - file: guide/reference/cli.md
        - file: guide/reference/check-rules.md
        - file: guide/reference/browser-limits.md
        - file: guide/reference/further-reading.md
    - file: guide/examples/index.md
      children:
        - file: guide/examples/directives/index.md
          children:
            - file: guide/examples/directives/markdown-basics.md
            - file: guide/examples/directives/video-and-slides.md
        - file: guide/examples/lds/normal-page.md
        - file: guide/examples/lds/scrolly-page.md
        - file: guide/examples/colab/heavy-compute.md
        - file: guide/examples/projects/index.md
          children:
            - file: guide/examples/projects/project_guidance.md
            - file: guide/examples/projects/example_macrocircuits/Macrocircuits.md
            - file: guide/examples/projects/example_neurons/index.md
              children:
                - file: guide/examples/projects/example_neurons/allen_visual_behavior.md

site:
  template: book-theme
  options:
    folders: true
    logo_text: Neuromatch Course Guide   # a course puts its own name here
    # The kit's branding (stylesheet, Rubik font, logos, favicon), written to
    # _nma/ by `nma-kit sync-assets` (CI runs it for you; the folder is not committed).
    style: _nma/site.css
    logo: _nma/logo.svg
    logo_dark: _nma/logo-dark.svg
    favicon: _nma/favicon.png

# Neuromatch settings. Read by the course kit (plugin and nma-kit CLI), not by MyST
# (MyST logs "extra key ignored: nma", which is expected).
# Use `key: value` entries with string values; `nma-kit check` rejects numbers, lists and deeper nesting.
nma:
  # The folders that hold your pages: the kit checks them and builds notebooks from
  # them (required since kit 0.4). Pages outside these folders are ignored by the kit.
  content:
    - guide
  # Branding (optional). Override the kit's colours and/or append your own CSS:
  #   brand:
  #     primary: "#D9480F"
  #   style:
  #     extra: _static/extra.css
  # Folders inside a day folder for {nma-data} files and {nma-slides} PDFs
  # (these are the defaults):
  #   assets:
  #     data: data
  #     image: images
  #     slides: slides
  # {nma-feedback} widgets post here (datatops). This is the guide's own
  # project: a course must use its own, never this one. user_key is a
  # write-only key that is published in every notebook, so it is not a secret.
  feedback:
    url: https://pmyvdlilci.execute-api.us-east-1.amazonaws.com/klab
    project: neuromatch_cn
    user_key: y1x3mpx5
  # Scrolly pages (layout: scrolly) run Python in the browser with Pyodide,
  # loaded from here. The host must send CORS headers.
  scrolly:
    pyodide_url: https://cdn.jsdelivr.net/pyodide/v314.0.7/full/
